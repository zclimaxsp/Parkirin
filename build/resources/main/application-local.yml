server:
  port: 8080
  address: 0.0.0.0
spring:
  application:
    name: parkirin-master-service
  datasource:
    url: jdbc:postgresql://localhost:5432/parkirin-master-db
    username: postgres
    password: postgres
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/parkirin-master-db
    username: postgres
    password: postgres
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
logging:
  level:
    org.springframework.r2dbc: DEBUG
    io.r2dbc.postgresql.QUERY: DEBUG
    io.r2dbc.postgresql.PARAM: DEBUG
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
  api-docs:
    path: /v3/api-docs
cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:8080
minio:
  endpoint: http://localhost:9090
  access-key: minioadmin
  secret-key: minioadmin
  bucket: parkirin